[project]
name = "agent-farm"
version = "3.4.0"
description = "AI organism evolution and parallel task execution - Speed optimized tool-enabled agents"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0,<2",
    "fastmcp==3.2.0",
    "httpx>=0.27.0,<1",
    "psutil>=5.9.0,<8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
agent-farm = "agent_farm.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
